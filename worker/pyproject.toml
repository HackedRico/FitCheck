[project]
name = "fitcheck-worker"
version = "0.1.0"
description = "FitCheck try-on worker: one HTTP endpoint over a try-on backend."
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "FitCheck contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pillow>=11",
]

[project.scripts]
fitcheck-worker = "fitcheck_worker.app:main"

[project.urls]
Homepage = "https://github.com/HackedRico/FitCheck"
Repository = "https://github.com/HackedRico/FitCheck"
Issues = "https://github.com/HackedRico/FitCheck/issues"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitcheck_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
